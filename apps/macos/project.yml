name: VaultSigner
options:
  bundleIdPrefix: com.vaultsigner
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

targets:
  VaultSigner:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: VaultSigner/Sources
      - path: VaultSigner/Resources
      - path: Shared
      - path: Generated
    dependencies:
      - target: VaultSignerAgent
      # VaultSignerCredentialProvider is deliberately NOT embedded here
      # yet: its entitlement fails code signing on a machine with no
      # Apple ID in Xcode at all (see PROGRESS.md item 2.7), and an
      # embedded dependency's sign failure fails the whole app's build,
      # not just the extension's own scheme. Wire embedding back up
      # (target: VaultSignerCredentialProvider, embed: true,
      # codeSignOnCopy: true) once signing is resolved.
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultsigner.app
        PRODUCT_NAME: VaultSigner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/release"
        OTHER_LDFLAGS: "-lvaultcore"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Generated/vaultcoreFFI.modulemap"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
    info:
      path: Generated-Info.plist
      properties:
        LSUIElement: false
        NSHumanReadableCopyright: "VaultSigner"
        CFBundleLocalizations: [en, ar]
        CFBundleDevelopmentRegion: en
    postCompileScripts:
      - name: "Embed VaultSignerAgent + its LaunchAgents plist (spec §8)"
        script: |
          set -euo pipefail
          # SMAppService's `.agent(plistName:)` needs the LaunchAgents
          # plist AND the helper it points to (BundleProgram) embedded in
          # this app's own bundle, not built by a separate Copy Files
          # phase that would run after codesigning invalidates it — a
          # `postCompileScripts` phase runs before the Sign step instead.
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/Library/LaunchAgents"
          cp "$SRCROOT/VaultSigner/Resources/com.vaultsigner.agent.plist" \
             "$CODESIGNING_FOLDER_PATH/Contents/Library/LaunchAgents/com.vaultsigner.agent.plist"
          rm -rf "$CODESIGNING_FOLDER_PATH/Contents/Resources/VaultSignerAgent.app"
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/Resources"
          ditto "$BUILT_PRODUCTS_DIR/VaultSignerAgent.app" \
                "$CODESIGNING_FOLDER_PATH/Contents/Resources/VaultSignerAgent.app"
        basedOnDependencyAnalysis: false

  VaultSignerCredentialProvider:
    # ASCredentialProviderExtension (spec §6.1). See PROGRESS.md item 2.7
    # for exactly what's verified about this target vs. what needs a
    # paid Apple Developer enrollment (the autofill-credential-provider
    # entitlement itself, and a stable Team ID for real distribution).
    type: app-extension
    platform: macOS
    # 14.0, not 13.0 like the other targets: the AuthenticationServices
    # passkey credential-provider APIs this target is built entirely
    # around (`ASPasskeyCredentialRequest`, `prepareInterface(forPasskeyRegistration:)`,
    # `...ForRequest:` overrides) are macOS 14+/iOS 17+ only per the SDK
    # headers — confirmed via a signing-free `xcodebuild build
    # CODE_SIGNING_ALLOWED=NO` compile, which is as far as this target
    # can be verified without the paid Apple Developer entitlement (see
    # PROGRESS.md item 2.7).
    deploymentTarget: "14.0"
    sources:
      - path: VaultSignerCredentialProvider/Sources
      - path: Shared
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultsigner.app.credentialprovider
        PRODUCT_NAME: VaultSignerCredentialProvider
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/release"
        OTHER_LDFLAGS: "-lvaultcore"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Generated/vaultcoreFFI.modulemap"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VaultSignerCredentialProvider/VaultSignerCredentialProvider.entitlements
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
    info:
      path: Generated-CredentialProvider-Info.plist
      properties:
        NSHumanReadableCopyright: "VaultSigner"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: false
              ProvidesPasskeys: true

  VaultSignerAgent:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: VaultSignerAgent/Sources
      - path: Shared
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultsigner.agent
        PRODUCT_NAME: VaultSignerAgent
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../target/release"
        OTHER_LDFLAGS: "-lvaultcore"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Generated/vaultcoreFFI.modulemap"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
    info:
      path: Generated-Agent-Info.plist
      properties:
        LSUIElement: true
        NSHumanReadableCopyright: "VaultSigner"
