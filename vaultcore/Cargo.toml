[package]
name = "vaultcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VaultSigner shared core: container format, KDF, AEAD, manifest, CTAP2/JSON-RPC protocol handling."
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
ed25519-dalek = "3.0"
p256 = { version = "0.14", features = ["ecdsa"] }
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
getrandom = "0.4"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
base64 = "0.23"
ctap-types = { version = "0.5", features = ["std"] }
cosey = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uniffi = { version = "0.29", optional = true, features = ["cli"] }

[dev-dependencies]
tempfile = "3"
ciborium = "0.2"

[[bin]]
name = "kdf-bench"
path = "src/bin/kdf_bench.rs"

[[bin]]
name = "chaos-writer"
path = "src/bin/chaos_writer.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi"]
